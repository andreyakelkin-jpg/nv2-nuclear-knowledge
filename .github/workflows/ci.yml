name: Cross-platform quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Compile Python entry points
        run: python -m compileall -q scripts tests
      - name: Run regression and portability tests
        run: python -m unittest discover -s tests -v
      - name: Run unconfigured doctor
        run: python scripts/run.py doctor --allow-unconfigured --skip-integrity --json
      - name: Test Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run.ps1 kb --help
      - name: Validate Linux shell scripts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n scripts/run.sh
          bash -n scripts/install.sh
          NV2_NUCLEAR_PYTHON="$(command -v python)" sh scripts/run.sh kb --help
